<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messenger</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="login-overlay">
  <div id="login-box">
    <div class="login-icon">💬</div>
    <h2>Messenger</h2>
    <p>Kết nối ngay với mọi người</p>
    <input id="username-input" type="text" placeholder="Nhập tên của bạn..."
           maxlength="24" autocomplete="off"/>
    <button id="join-btn">Tiếp tục</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="app">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-top">
      <div class="header-row">
        <h1>Đoạn chat</h1>
        <div id="my-avatar" class="avatar c0"></div>
      </div>
      <div class="search-bar">
        <span>🔍</span>
        <input type="text" id="search-input" placeholder="Tìm kiếm..."/>
      </div>
    </div>
    <div class="section-label">🟢 Đang hoạt động</div>
    <div id="user-list"></div>
  </div>

  <!-- MAIN CHAT -->
  <div id="main">

    <div id="empty-state">
      <div class="empty-icon">💬</div>
      <h3>Tin nhắn của bạn</h3>
      <p>Chọn người để bắt đầu trò chuyện</p>
    </div>

    <div id="chat-header">
      <div class="avatar-wrap">
        <div class="avatar c0" id="ch-avatar"></div>
        <span class="online-dot"></span>
      </div>
      <div class="header-info">
        <div id="ch-name"></div>
        <div id="ch-status">Đang hoạt động</div>
      </div>
      <div class="header-actions">
        <button class="hdr-btn">📞</button>
        <button class="hdr-btn">📹</button>
        <button class="hdr-btn">ℹ️</button>
      </div>
    </div>

    <div id="messages-wrap">
      <div id="messages"></div>
      <div id="typing-ind">
        <div class="typing-av c0" id="typing-av"></div>
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div id="input-area">
      <button class="act-btn">📎</button>
      <button class="act-btn">🖼️</button>
      <textarea id="msg-input" placeholder="Aa" rows="1"></textarea>
      <button id="like-btn">👍</button>
      <button id="send-btn">➤</button>
    </div>

  </div>
</div>

<!-- ==================== TOASTS ==================== -->
<div id="toasts"></div>

<!-- ==================== SCRIPTS ====================
     Thứ tự load: socket.io → helpers → store → ui → socket → app
     Tất cả biến là global, không dùng module/IIFE
-->
<script src="/socket.io/socket.io.js"></script>
<script src="/js/helpers.js"></script>
<script src="/js/store.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/socket.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
